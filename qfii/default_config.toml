# Qfii defaults. Override any key in a local file passed with
# --config (e.g. config.local.toml); unknown keys are rejected.

[paths]
db = "data/qfii.db"

# Model tiers. provider:
#   "fake"           scripted replies, no model needed (default; tests use it)
#   "ollama"         local Ollama (base_url defaults to http://localhost:11434)
#   "openai_compat"  any OpenAI-compatible endpoint (vLLM / NIM on Brev, OpenAI);
#                    api_key_env is the NAME of the env var holding the key.
# num_ctx: context window to request; a prompt that fills it is refused rather
#   than silently truncated. think: let reasoning models think first (the
#   thinking is kept out of the parsed answer). merge_system_prompt: put the
#   system prompt in the user turn (recommended for DeepSeek-R1 distills).
# json_schema: send the reply's JSON schema for constrained decoding. Turn off
#   for DeepSeek-R1 on Ollama (thinking + schema makes Ollama return HTTP 500);
#   replies are validated in code either way.
# max_output_tokens: cap on generated tokens INCLUDING thinking. A reply that
#   hits it is invalid and retried once, instead of thinking until a timeout.
# usd_per_m_input / usd_per_m_output: price per million tokens, for budgets.
# See configs/mac-local.toml (16 GB Mac) and configs/team-gpu.toml (GPU).
[models.mid]
provider = "fake"
model = "fake-mid"
base_url = ""
api_key_env = ""
usd_per_m_input = 0.0
usd_per_m_output = 0.0
num_ctx = 16384
think = false
temperature = 0.0
merge_system_prompt = false
timeout_s = 600.0
max_output_tokens = 4096
json_schema = true

[models.strong]
provider = "fake"
model = "fake-strong"
base_url = ""
api_key_env = ""
usd_per_m_input = 0.0
usd_per_m_output = 0.0
num_ctx = 16384
think = false
temperature = 0.0
merge_system_prompt = false
timeout_s = 600.0
max_output_tokens = 4096
json_schema = true

[models.strongest]
provider = "fake"
model = "fake-strongest"
base_url = ""
api_key_env = ""
usd_per_m_input = 0.0
usd_per_m_output = 0.0
num_ctx = 16384
think = false
temperature = 0.0
merge_system_prompt = false
timeout_s = 600.0
max_output_tokens = 4096
json_schema = true

# One LLM per team. daily_budget_usd caps spend per agent per day.
[agents.research]
tier = "mid"
daily_budget_usd = 2.0

[agents.assessment]
tier = "strong"
daily_budget_usd = 5.0

[agents.risk]
tier = "strong"
daily_budget_usd = 5.0

# Investment committee: three equal votes, no chair.
# aggressive favours fundamental upside; conservative favours downside protection;
# neutral weighs both against the S&P 500 and the whole portfolio, so it gets the
# strongest model.
[agents.aggressive]
tier = "strong"
daily_budget_usd = 5.0

[agents.conservative]
tier = "strong"
daily_budget_usd = 5.0

[agents.neutral]
tier = "strongest"
daily_budget_usd = 8.0

# How LLM calls share the machine. exclusive = only one model loaded at a time:
# the resident model finishes all its queued calls (waiting settle_ms for
# stragglers) before it is unloaded and the next model loads. max_batch caps how
# many calls one model serves while others wait. max_concurrent: parallel calls.
[runtime]
exclusive_models = true
max_concurrent_calls = 1
settle_ms = 150
max_batch = 64

[universe]
symbols = ["AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "JPM", "XOM", "JNJ", "PG"]

# Market data. "synthetic" = deterministic offline series (for development);
# "csv" = <csv_dir>/<SYMBOL>.csv with columns date,close,volume, filled by
# `qfii data fetch` (Yahoo prices, FRED macro, SEC fundamentals).
# sec_user_agent: SEC requires a contact, e.g. "Qfii research you@example.com"
#   (or "env:SEC_USER_AGENT"); SEC fundamentals, 8-K news and filing search
#   (EdgarTools, `pip install qfii[sec]`) are off while it is empty.
# news_lookback_days: how far back 8-K current reports count as news.
[data]
source = "synthetic"
csv_dir = "data/prices"
macro_dir = "data/macro"
fundamentals_dir = "data/fundamentals"
macro_series = ["DGS10", "DGS2", "T10Y2Y", "DFF", "CPIAUCSL", "UNRATE", "BAMLH0A0HYM2", "VIXCLS"]
sec_user_agent = ""
sec_cache_dir = "data/sec"
news_lookback_days = 120

# Tools are served over MCP. Empty mcp_url = run the tool server in-process;
# otherwise e.g. "http://127.0.0.1:9100/mcp" for `qfii serve tools`.
[tools]
mcp_url = ""

# Continuous discovery. batch_size: new symbols researched per cycle.
# queue_cap: stop discovering while this many packets await Assessment.
# cache_ttl_hours: do not re-research a symbol within this window.
# min_avg_daily_volume_usd: cheap liquidity screen before any LLM call.
[research]
batch_size = 3
queue_cap = 50
cache_ttl_hours = 24
min_avg_daily_volume_usd = 5000000.0
min_observations = 200
stale_after_days = 5

# Committee protocol. Each round every member writes an argument and casts one
# equal-weight ballot: invest / replace / pass / request_info / send_back.
#   invest_rule      votes needed to trade (invest, replace, pass): "unanimous"
#                    or "majority" (2 of 3). Sizes must also agree: all proposed
#                    sizes within size_tolerance_pct of each other; the median wins.
#   procedural_rule  votes needed to request info or send back to a team.
#   max_rounds       hard stop: no consensus by then -> shelve, move to next paper.
#   max_send_backs   full revisions allowed per paper before it is shelved.
#   memory_items     how many of its own memories each member sees per prompt.
[committee]
max_rounds = 5
invest_rule = "unanimous"
procedural_rule = "majority"
size_tolerance_pct = 10.0
max_send_backs = 1
memory_items = 20

# Assessment and Risk & Validation may research on their own (MCP tools incl. a
# calculator) when the committee asks them something: at most this many turns.
[teams]
max_tool_turns = 6

# Portfolio economics every agent but Research sees. Tax rates are NOT set here:
# they come from the user's income and filing status (`qfii setup`), see tax.py.
[portfolio]
benchmark = "SPY"
commission_bps = 0.0
slippage_bps = 5.0
long_term_after_days = 365

# Hard limits. Enforced in code; no agent can override them.
[limits]
starting_cash_usd = 100000.0
max_position_pct = 10.0
max_order_usd = 10000.0
min_cash_pct = 20.0
daily_order_cap = 5

[execution]
mode = "paper"
