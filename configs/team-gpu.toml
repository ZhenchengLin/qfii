# Team setup for a GPU machine (e.g. a Brev instance running Ollama). Reach it
# through an SSH tunnel so base_url stays local:
#   ssh -N -L 11434:localhost:11434 <brev-instance>
# Pull the models on the GPU machine:
#   ollama pull qwen3.5:27b      # max tier: neutral member      (~17 GB at Q4)
#   ollama pull deepseek-r1:14b  # high tier: assessment, risk, aggressive, conservative (~9 GB)
#   ollama pull qwen3.5:9b       # mid tier: research            (~6.6 GB)
# Memory: all three (~33 GB at Q4 plus context) fit on a ~48 GB GPU, so models
# stay loaded side by side (exclusive_models = false). On a smaller GPU set it
# to true and the scheduler swaps them. On a 16 GB Mac use configs/mac-local.toml.

[data]
source = "csv"

[models.mid]
provider = "ollama"
model = "qwen3.5:9b"
num_ctx = 16384
think = false            # facts only: no need to think, keeps research cheap

[models.strong]
provider = "ollama"
model = "deepseek-r1:14b"
num_ctx = 24576
think = true             # R1 always reasons; Ollama returns it separately
temperature = 0.6        # DeepSeek's recommended setting for R1 distills
merge_system_prompt = true
max_output_tokens = 6144

[models.strongest]
provider = "ollama"
model = "qwen3.5:27b"
num_ctx = 32768
think = true
max_output_tokens = 8192

[runtime]
exclusive_models = false
max_concurrent_calls = 3
